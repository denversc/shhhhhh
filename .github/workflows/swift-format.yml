name: swift-format

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/swift-format.yml"
      - ".swift-format"
      - "scripts/swift_format.zsh"
      - "ios/**/*.swift"
  schedule:
    - cron: "0 11 * * *" # Run nightly at 11am UTC (3am Pacific, 6am Eastern)

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  swift-format:
    name: swift-format
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          show-progress: false
          persist-credentials: false
      - name: swift-format check
        run: ./scripts/swift_format.zsh --check
