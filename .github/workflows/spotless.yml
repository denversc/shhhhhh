name: spotless

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/spotless.yml"
      - "scripts/spotless.zsh"
      - "android/**/*.kt"
      - "android/**/*.kts"
  schedule:
    - cron: "0 11 * * *" # Run nightly at 11am UTC (3am Pacific, 6am Eastern)

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  spotless:
    name: spotless
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          show-progress: false
          persist-credentials: false
      - name: set up jdk 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # ratchet:actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: zsh install
        run: sudo apt install zsh
      - name: spotless check
        run: ./scripts/spotless.zsh --check
