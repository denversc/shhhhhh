name: prettier

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/prettier.yml'
      - 'tools/prettier/**'
      - 'scripts/prettier.zsh'
      - '**/*.md'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.json'
  schedule:
    - cron: '0 11 * * *' # Run nightly at 11am UTC (3am Pacific, 6am Eastern)

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  prettier:
    name: prettier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          show-progress: false
          persist-credentials: false
      - name: zsh install
        run: apt install zsh
      - name: prettier
        run: ./scripts/prettier.zsh --check
