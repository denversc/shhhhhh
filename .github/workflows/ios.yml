name: ios

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios.yml"
      - "scripts/ios_*.zsh"
      - "ios/**"
  schedule:
    - cron: "0 11 * * *" # Run nightly at 11am UTC (3am Pacific, 6am Eastern)

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ubuntu-gate:
    name: ubuntu-gate
    runs-on: ubuntu-latest
    # TODO: cache some/all of the build artifacts to improve runtimes, especially the boringssl build
    timeout-minutes: 15
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: verify swift
        run: swift --version

      - name: compile ShhhhhhCore (Linux)
        working-directory: ios/ShhhhhhCore
        run: swift build

      - name: pre-flight test ShhhhhhCore (Linux)
        working-directory: ios/ShhhhhhCore
        run: swift test

  macos-authoritative-verification:
    name: macos-simulator-verification
    needs: [ubuntu-gate]
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_27.app

      - name: run full unit test suite on iOS Simulator
        run: ./scripts/ios_unit_tests.zsh

      - name: run iOS UI tests on iOS Simulator
        run: ./scripts/ios_ui_tests.zsh
