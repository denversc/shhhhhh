name: android

on:
  workflow_dispatch:
    inputs:
      gradle-cache-mode:
        description: "Gradle cache mode"
        type: choice
        options:
          - restore
          - save
          - none
        default: restore
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "!android/**/*.md"
      - "!android/**/.gitignore"
  schedule:
    - cron: "0 11 * * *" # Run nightly at 11am UTC (3am Pacific, 6am Eastern)

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: set up jdk 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: restore gradle cache
        if:
          github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' &&
          inputs['gradle-cache-mode'] == 'restore')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            !~/.gradle/**/*.lock
            !~/.gradle/**/gc.properties
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ github.workflow }}-gradle-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: ${{ github.workflow }}-gradle-

      - name: gradle check
        run: ./android/gradlew -p android check -x spotlessCheck

      - name: save gradle cache
        if:
          github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' &&
          inputs['gradle-cache-mode'] == 'save')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/save@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            !~/.gradle/**/*.lock
            !~/.gradle/**/gc.properties
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ github.workflow }}-gradle-${{ github.ref_name }}-${{ github.run_id }}

      - name: upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
          if-no-files-found: ignore
